name: Feature Request
description: Suggest an improvement or new capability for Framelet
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or limitation you are running into.
      placeholder: I'm trying to...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: What would the ideal behavior or UI look like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, references, or links.
