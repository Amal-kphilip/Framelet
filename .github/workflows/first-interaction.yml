name: First Interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue in Framelet! A maintainer will review it soon.
          pr-message: >
            Thanks for opening your first pull request in Framelet! Please make sure
            `npm run check` passes and that your commits follow Conventional Commits.
