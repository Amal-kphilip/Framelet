name: First Interaction

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening your first issue in Framelet! 🎉
            Please include steps to reproduce, your browser and OS, and the video format if relevant. I'll take a look as soon as I can.
          pr_message: |
            Thanks for your first pull request to Framelet! 🚀
            Please make sure `npm run check` passes locally and that your PR title follows Conventional Commits (for example `fix: ...` or `feat: ...`).
