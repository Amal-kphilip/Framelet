documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "docs/**"]

ci:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", ".github/dependabot.yml"]

dependencies:
  - changed-files:
      - any-glob-to-any-file: ["package.json", "package-lock.json"]

ui:
  - changed-files:
      - any-glob-to-any-file: ["src/components/**", "src/app/**"]

core:
  - changed-files:
      - any-glob-to-any-file: ["src/lib/**", "src/types/**"]
